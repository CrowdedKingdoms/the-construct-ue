<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio dock</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101111; color: #e6e6e6; font: 13px/1.4 system-ui, sans-serif; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; }
  body.booting #status { display: none; }
  body.booting iframe { visibility: visible; }
</style>
</head>
<body>
<div id="status">The Studio dock is not ready yet.</div>
<script src="dock.js"></script>
</body>
</html>
